name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/order-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/order-service/**'
  workflow_dispatch:

env:
  SERVICE_NAME: order-service
  DOCKER_IMAGE: bishtps3/order-service

permissions:
  contents: write

jobs:
  # ─── JOB 1: TEST ──────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/order-service/go.sum

      - name: Run tests
        working-directory: services/order-service
        env:
          SERVER_PORT: "8004"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: orders_test_db
          JWT_SECRET: test-secret
          USER_SERVICE_ADDR: localhost:50051
          PRODUCT_SERVICE_ADDR: localhost:50052
          INVENTORY_SERVICE_ADDR: localhost:50053
        run: go test ./...

  # ─── JOB 2: BUILD & PUSH ──────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/order-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3: UPDATE HELM VALUES ────────────────────────────
  update-manifest:
    name: Update Helm Values
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values-dev.yaml
        run: |
          NEW_TAG=${{ needs.build-and-push.outputs.image_tag }}
          sed -i "s|tag:.*|tag: ${NEW_TAG}|g" \
            infra/helm/order-service/values-dev.yaml
          echo "Updated image tag to: ${NEW_TAG}"

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/order-service/values-dev.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: update order-service image tag to ${{ needs.build-and-push.outputs.image_tag }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $i), retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
          